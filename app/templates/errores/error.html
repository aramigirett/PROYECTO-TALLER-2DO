{% extends layout %}

{% block titulo %}{{ codigo }} - {{ titulo }}{% endblock %}

{% block contenido %}
<div class="empty">
  <div class="empty-header">{{ codigo }}</div>
  <p class="empty-title"><i class="fas {{ icono }} me-2"></i>{{ titulo }}</p>
  <p class="empty-subtitle text-secondary">{{ mensaje }}</p>
  {% if ventana %}
  <p class="text-secondary">Ventana a la que intentó entrar: <strong>{{ ventana }}</strong></p>
  {% endif %}
  <div class="empty-action">
    <a href="{{ url_inicio }}" class="btn btn-primary"><i class="fas fa-home me-2"></i>{{ texto_inicio }}</a>
    {% if mostrar_atras %}
    <button type="button" class="btn btn-outline-secondary" onclick="if (window.history.length > 1) { window.history.back(); } else { window.location.href = '{{ url_inicio }}'; }">
      <i class="fas fa-arrow-left me-2"></i>Volver atrás
    </button>
    {% endif %}
  </div>
</div>
{% endblock %}
