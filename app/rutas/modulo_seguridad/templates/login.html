<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta name="description" content="OdontoClinic - Acceso al sistema">

    <title>Iniciar Sesión - OdontoClinic</title>

    <link href="{{ url_for('static', filename='vendor/fontawesome-free/css/all.min.css') }}" rel="stylesheet" type="text/css">
    <link href="https://fonts.googleapis.com/css?family=Nunito:400,600,700,800" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/sb-admin-2.min.css') }}" rel="stylesheet">

    <style>
        :root {
            --primary-color: #5B7FBF;
            --secondary-color: #2E5C8A;
            --accent-color: #FFD699;
            --light-bg: #F0F4F8;
        }

        body {
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%);
            font-family: 'Nunito', sans-serif;
            min-height: 100vh;
        }

        .auth-wrapper {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
        }

        .auth-card {
            width: 100%;
            max-width: 420px;
            background: #fff;
            border-radius: 0.75rem;
            box-shadow: 0 1rem 3rem rgba(0, 0, 0, 0.2);
            overflow: hidden;
        }

        .auth-card-header {
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%);
            color: #fff;
            padding: 2rem 2rem 1.5rem;
            text-align: center;
        }

        .auth-card-header i {
            font-size: 2.5rem;
            color: var(--accent-color);
        }

        .auth-card-header h1 {
            font-size: 1.35rem;
            font-weight: 700;
            margin: 0.5rem 0 0;
        }

        .auth-card-body {
            padding: 2rem;
        }

        .btn-primary {
            background-color: var(--primary-color);
            border-color: var(--primary-color);
            font-weight: 600;
        }

        .btn-primary:hover {
            background-color: var(--secondary-color);
            border-color: var(--secondary-color);
        }
    </style>
</head>

<body>

    <div class="auth-wrapper">
        <div class="auth-card">
            <div class="auth-card-header">
                <i class="fas fa-tooth"></i>
                <h1>OdontoClinic</h1>
                <p class="mb-0 small">Ingresá tu CI/RUC y contraseña</p>
            </div>
            <div class="auth-card-body">

                {% with mensajes = get_flashed_messages(with_categories=true) %}
                    {% if mensajes %}
                        {% for categoria, mensaje in mensajes %}
                            <div class="alert alert-{{ 'danger' if categoria == 'danger' else categoria }}" role="alert">
                                {{ mensaje }}
                            </div>
                        {% endfor %}
                    {% endif %}
                {% endwith %}

                <form method="POST" action="{{ url_for('seguridad.login') }}">
                    <div class="form-group">
                        <label for="ci_ruc">CI/RUC</label>
                        <input type="text" class="form-control" id="ci_ruc" name="ci_ruc"
                               placeholder="Ingresá tu CI o RUC" required autofocus autocomplete="username">
                    </div>
                    <div class="form-group">
                        <label for="password">Contraseña</label>
                        <input type="password" class="form-control" id="password" name="password"
                               placeholder="Ingresá tu contraseña" required autocomplete="current-password">
                    </div>
                    <button type="submit" class="btn btn-primary btn-block">
                        <i class="fas fa-sign-in-alt mr-2"></i>Iniciar Sesión
                    </button>
                </form>

            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='vendor/jquery/jquery.min.js') }}"></script>
    <script src="{{ url_for('static', filename='vendor/bootstrap/js/bootstrap.bundle.min.js') }}"></script>

</body>

</html>
