<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta name="description" content="OdontoClinic - Acceso al sistema">

    <title>Iniciar Sesión - OdontoClinic</title>

    <link href="{{ url_for('static', filename='vendor/fontawesome-free/css/all.min.css') }}" rel="stylesheet" type="text/css">
    <link href="{{ url_for('static', filename='vendor/tabler/css/tabler.min.css') }}" rel="stylesheet">

    <style>
        :root {
            --tblr-primary: #5B7FBF;
            --tblr-primary-rgb: 91, 127, 191;
            --primary-color: #5B7FBF;
            --secondary-color: #2E5C8A;
            --accent-color: #FFD699;
        }

        .brand-icon {
            font-size: 2.5rem;
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
    </style>
</head>

<body class="border-top-wide border-primary d-flex flex-column">

    <div class="page page-center">
        <div class="container container-tight py-4">

            <div class="text-center mb-4">
                <i class="fas fa-tooth brand-icon"></i>
                <h1 class="h2 mt-2 mb-1">OdontoClinic</h1>
                <div class="text-secondary">Ingresá tu CI/RUC y contraseña</div>
            </div>

            <form class="card card-md" method="POST" action="{{ url_for('seguridad.login') }}">
                <div class="card-body">

                    {% with mensajes = get_flashed_messages(with_categories=true) %}
                        {% if mensajes %}
                            {% for categoria, mensaje in mensajes %}
                                <div class="alert alert-{{ 'danger' if categoria == 'danger' else categoria }}" role="alert">
                                    {{ mensaje }}
                                </div>
                            {% endfor %}
                        {% endif %}
                    {% endwith %}

                    <div class="mb-3">
                        <label class="form-label" for="ci_ruc">CI/RUC</label>
                        <input type="text" class="form-control" id="ci_ruc" name="ci_ruc"
                               placeholder="Ingresá tu CI o RUC" required autofocus autocomplete="username">
                    </div>
                    <div class="mb-2">
                        <label class="form-label" for="password">Contraseña</label>
                        <input type="password" class="form-control" id="password" name="password"
                               placeholder="Ingresá tu contraseña" required autocomplete="current-password">
                    </div>
                    <div class="form-footer">
                        <button type="submit" class="btn btn-primary w-100">
                            <i class="fas fa-sign-in-alt me-2"></i>Iniciar Sesión
                        </button>
                    </div>

                </div>
            </form>

        </div>
    </div>

    <script src="{{ url_for('static', filename='vendor/tabler/js/tabler.min.js') }}"></script>

</body>

</html>
