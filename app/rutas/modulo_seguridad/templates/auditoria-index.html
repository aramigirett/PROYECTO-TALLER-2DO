{% extends 'base.html' %}

{% block titulo %}
Tablero de Administrador
{% endblock %}

{% block contenido %}
<div class="container mt-10">
  <h3>Tablero de Administrador - Intentos de Acceso</h3>

  <!-- Tarjeta -->
  <div class="card">
    <div class="card-header d-flex justify-content-between align-items-center">
      <span>Últimos intentos de acceso registrados</span>
      <button type="button" class="btn btn-outline-primary btn-sm" id="btnActualizar">
        <i class="fas fa-sync-alt"></i> Actualizar
      </button>
    </div>
    <div class="card-body">
      <div class="table-responsive">
        <table class="table table-striped" id="tbl">
          <thead>
            <tr>
              <th>Fecha/Hora</th>
              <th>CI/RUC ingresado</th>
              <th>Acción</th>
              <th>Resultado</th>
              <th>IP</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
  </div>
  <!-- /Tarjeta -->
</div>

{% endblock %}


{% block js %}
<script>

  const badgeResultado = (resultado) => {
    const clase = resultado === 'EXITOSO' ? 'badge-success' : 'badge-danger';
    return `<span class="badge ${clase}">${resultado}</span>`;
  };

  const initDatatable = () => {
    return $('#tbl').DataTable({
      language: { url: "{{ url_for('static', filename='vendor/datatables/es-ES.json') }}" },
      ajax: { url: '/api/v1/auditoria/intentos', dataSrc: 'data' },
      order: [[0, 'desc']],
      columns: [
        { data: 'fecha_hora' },
        { data: 'ci_ruc_ingresado' },
        { data: 'accion' },
        { data: function(row) { return badgeResultado(row.resultado); } },
        { data: function(row) { return row.ip || ''; } }
      ]
    });
  };

  $(function() {
    const tabla = initDatatable();
    $('#btnActualizar').on('click', function() {
      tabla.ajax.reload(null, false);
    });
  });
</script>
{% endblock %}
