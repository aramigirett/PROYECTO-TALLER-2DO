{% extends 'base.html' %}

{% block titulo %}
Medicamentos
{% endblock %}

{% block contenido %}
<div class="container mt-10">
  <h3>Listar Medicamentos</h3>

  <!-- Tarjeta -->
  <div class="card">
    <div class="card-header">
      <button type="button" class="btn btn-outline-primary" id="btnAgregar">Agregar</button>
    </div>
    <div class="card-body">
      <div class="table-responsive">
        <table class="table table-striped" id="tbl">
          <thead>
            <tr>
              <th>Nombre Comercial</th>
              <th>Presentación</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
  </div>
  <!-- /Tarjeta -->

  <!-- Modal formulario -->
  <div class="modal" id="modalFormulario">
    <div class="modal-dialog modal-dialog-centered modal-lg">
      <div class="modal-content">
        <!-- Modal Header -->
        <div class="modal-header">
          <h4 class="modal-title" id="modalTitle"></h4>
          <button type="button" class="close" data-dismiss="modal">&times;</button>
        </div>

        <!-- Modal Body -->
        <div class="modal-body" style="max-height: 70vh; overflow-y: auto;">
          <input type="hidden" id="txtIdMedicamento">

          <div class="container-fluid">
            <div class="row">
              <div class="col-md-12">
                <div class="form-group">
                  <label for="txtNombreComercial">Nombre Comercial:</label>
                  <input type="text" class="form-control" placeholder="Ingrese el nombre comercial" id="txtNombreComercial">
                </div>
              </div>
              <div class="col-md-12">
                <div class="form-group">
                  <label for="txtPresentacion">Presentación (opcional):</label>
                  <input type="text" class="form-control" placeholder="Ej: Caja x 20 comprimidos" id="txtPresentacion">
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- Modal Footer -->
        <div class="modal-footer">
          <button type="button" class="btn btn-primary" id="btnGuardar">Guardar</button>
          <button type="button" class="btn btn-danger" data-dismiss="modal">Cerrar</button>
        </div>
      </div>
    </div>
  </div>
</div>

{% endblock %}


{% block js %}
<script>

  const initDatatable = () => {
    $('#tbl').DataTable({
      language: {
        url: "{{ url_for('static', filename='vendor/datatables/es-ES.json') }}",
      },
      ajax: '/api/v1/medicamentos',
      columns: [
        { data: 'nombre_comercial' },
        { data: d => d.presentacion || '-' },
        { data: function(row) {
            return `<button type="button" name="btn_editar" class="btn btn-info" data-id="${row.id_medicamento}" title="Editar"><i class="fas fa-edit"></i></button>
                    <button type="button" name="btn_eliminar" class="btn btn-danger" data-id="${row.id_medicamento}" title="Eliminar"><i class="fas fa-trash-alt"></i></button>`
          }
        }
      ]
    });
  }

  const agregar = () => {
    $('#btnAgregar').on('click', function(){
      $('#modalTitle').text("Agregar Medicamento");
      $('#txtIdMedicamento').val("");
      $('#txtNombreComercial').val("");
      $('#txtPresentacion').val("");
      $('#modalFormulario').modal();
    });
  }

  const guardar = () => {
    $('#btnGuardar').on('click', function() {
      const id = $('#txtIdMedicamento').val();
      const nombre_comercial = $('#txtNombreComercial').val();
      const presentacion = $('#txtPresentacion').val();
      const tabla = $('#tbl').DataTable();

      if(!nombre_comercial.trim()) {
        Swal.fire("Error", "El campo Nombre Comercial no puede estar vacío.", "error");
        return;
      }

      const payload = { nombre_comercial, presentacion };

      if(id) {
        // update
        fetch(`/api/v1/medicamentos/${id}`, {
          method: 'PUT',
          headers: {
            'Content-Type': 'application/json',
          }, body: JSON.stringify(payload)
        })
        .then(resp => resp.json())
        .then(data => {
          if(data && !data.error && data.success) {
            tabla.ajax.reload();
            Swal.fire("Actualizado", "El medicamento ha sido actualizado correctamente.", "success");
          } else {
            Swal.fire("Error", data.error, "error");
          }
        }).catch(err => {
          console.error(err);
          Swal.fire("Error", "Ocurrió un error al actualizar el medicamento.", "error");
        });
      } else {
        // insert
        fetch(`/api/v1/medicamentos`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          }, body: JSON.stringify(payload)
        })
        .then(resp => resp.json())
        .then(data => {
          if(data && !data.error && data.success) {
            tabla.ajax.reload();
            Swal.fire("Agregado", "El medicamento ha sido agregado correctamente.", "success");
          } else {
            Swal.fire("Error", data.error, "error");
          }
        }).catch(err => {
          console.error(err);
          Swal.fire("Error", "Ocurrió un error al guardar el medicamento.", "error");
        });
      }
      $('#modalFormulario').modal("hide");
    });
  }

  const editar = () => {
    $('#tbl').on('click', 'button[name="btn_editar"]',function(){
      const btn = $(this);
      Swal.fire({
        title: "¿Deseas editar este registro?",
        showCancelButton: true,
        confirmButtonText: "Si",
        cancelButtonText: `No`
      }).then((result) => {
        if (result.isConfirmed) {
          $('#modalTitle').text("Editar Medicamento");

          const id = btn.data('id');

          fetch(`/api/v1/medicamentos/${id}`, {
            method: 'GET',
            headers: {
              'Content-Type': 'application/json'
            }
          })
          .then(resp => resp.json())
          .then(data => {
            $('#txtIdMedicamento').val(data.data.id_medicamento);
            $('#txtNombreComercial').val(data.data.nombre_comercial);
            $('#txtPresentacion').val(data.data.presentacion || '');
            $('#modalFormulario').modal();
          });
        }
      });
    });
  }

  const eliminar = () => {
    $('#tbl').on('click', 'button[name="btn_eliminar"]',function(){
      const id = $(this).data('id');
      Swal.fire({
        title: "¿Deseas eliminar este registro?",
        showCancelButton: true,
        confirmButtonText: "Si",
        cancelButtonText: `No`
      }).then((result) => {
        if (result.isConfirmed) {
          fetch(`/api/v1/medicamentos/${id}`, {
            method: 'DELETE',
            headers: {
              'Content-Type': 'application/json',
            }
          })
          .then(resp => resp.json())
          .then(data => {
            if(data && !data.error && data.success) {
              $('#tbl').DataTable().ajax.reload();
              Swal.fire("Eliminado", data.mensaje, "success");
            } else {
              Swal.fire("Error", data.error, "error");
            }
          }).catch(err => {
            Swal.fire("Error", "Ocurrió un error al eliminar el medicamento.", "error");
          });
        }
      });

    });
  }

  const addEvents = () => {
    agregar();
    guardar();
    editar();
    eliminar();
  }

  $(function() {
    initDatatable();
    addEvents();
  });
</script>
{% endblock %}
