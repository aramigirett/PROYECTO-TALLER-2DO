{% extends 'base_tabler.html' %}

{% block titulo %}Cargos{% endblock %}

{% block contenido %}
<div class="page-header d-print-none mb-3">
  <div class="row align-items-center">
    <div class="col">
      <div class="page-pretitle">Agendamiento · Referenciales</div>
      <h2 class="page-title">Cargos</h2>
    </div>
    {% if puede('cargo', 'nuevo') %}
    <div class="col-auto ms-auto">
      <button type="button" class="btn btn-primary" id="btnAgregar">
        <i class="fas fa-plus me-2"></i>Agregar
      </button>
    </div>
    {% endif %}
  </div>
</div>

<div class="card">
  <div class="card-header">
    <label class="form-check form-switch mb-0">
      <input class="form-check-input" type="checkbox" id="chkInactivos">
      <span class="form-check-label">Mostrar inactivos</span>
    </label>
  </div>
  <div class="table-responsive">
    <table class="table table-vcenter card-table" id="tbl">
      <thead>
        <tr>
          <th>Descripción</th>
          <th style="width: 120px;">Estado</th>
          <th class="w-1">Acciones</th>
        </tr>
      </thead>
      <tbody id="tbody">
        <tr><td colspan="3" class="text-center text-muted py-4">Cargando…</td></tr>
      </tbody>
    </table>
  </div>
</div>

{# Modal Alta / Modificar #}
<div class="modal modal-blur fade" id="modalFormulario" tabindex="-1" aria-labelledby="modalTitle" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="modalTitle"></h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
      </div>
      <form id="formulario" novalidate>
        <div class="modal-body">
          <input type="hidden" id="txtId">
          <div class="mb-3">
            <label class="form-label required" for="txtClave">Descripción</label>
            <input type="text" class="form-control" id="txtClave" maxlength="60" placeholder="Ej.: RECEPCIONISTA" autocomplete="off" style="text-transform: uppercase;">
            <div class="invalid-feedback" id="errValor"></div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-link link-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button type="submit" class="btn btn-primary" id="btnGuardar">Guardar</button>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}

{% block js %}
<script src="{{ url_for('static', filename='js/facturacion-validadores.js') }}"></script>
<script src="{{ url_for('static', filename='js/facturacion-listado.js') }}"></script>
<script>
(function () {
  const API = '/api/v1/cargos';
  const PK = 'id_cargo';
  const CAMPO = 'descripcion';
  const PUEDE_EDITAR = {{ 'true' if puede('cargo', 'editar') else 'false' }};
  const PUEDE_ANULAR = {{ 'true' if puede('cargo', 'anular') else 'false' }};

  const tbody = document.getElementById('tbody');
  const chkInactivos = document.getElementById('chkInactivos');
  const modalEl = document.getElementById('modalFormulario');
  const modal = bootstrap.Modal.getOrCreateInstance(modalEl);
  const form = document.getElementById('formulario');
  const inpId = document.getElementById('txtId');
  const inpValor = document.getElementById('txtClave');
  const errValor = document.getElementById('errValor');
  const btnGuardar = document.getElementById('btnGuardar');

  const L = window.FacturacionListado;
  const V = window.FacturacionValidadores;
  const { escapar, pedir } = L;

  const mostrarError = (msg) => { errValor.textContent = msg; inpValor.classList.add('is-invalid'); };
  const limpiarError = () => { errValor.textContent = ''; inpValor.classList.remove('is-invalid'); };
  const validar = (v) => V.descripcion(v, { etiqueta: 'descripción' });

  async function cargar() {
    try {
      const { ok, data } = await pedir(L.urlListado(API, chkInactivos));
      if (!ok || !data || !data.success) throw new Error();
      if (!data.data.length) {
        tbody.innerHTML = '<tr><td colspan="3" class="text-center text-muted py-4">No hay cargos registrados.</td></tr>';
        return;
      }
      tbody.innerHTML = data.data.map((f) => {
        const acciones = L.acciones({ activo: f.activo, id: f[PK], descripcion: f[CAMPO], puedeEditar: PUEDE_EDITAR, puedeAnular: PUEDE_ANULAR });
        return `<tr class="${L.claseFila(f.activo)}">
          <td>${escapar(f[CAMPO])}</td>
          <td>${L.badgeEstado(f.activo)}</td>
          <td class="text-nowrap"><div class="btn-list flex-nowrap">${acciones}</div></td>
        </tr>`;
      }).join('');
    } catch (e) {
      tbody.innerHTML = '<tr><td colspan="3" class="text-center text-danger py-4">No se pudo cargar el listado.</td></tr>';
    }
  }

  function abrirModal(titulo, id, valor) {
    document.getElementById('modalTitle').textContent = titulo;
    inpId.value = id || '';
    inpValor.value = valor || '';
    limpiarError();
    modal.show();
  }

  const btnAgregar = document.getElementById('btnAgregar');
  if (btnAgregar) btnAgregar.addEventListener('click', () => abrirModal('Agregar Cargo'));

  modalEl.addEventListener('shown.bs.modal', () => inpValor.focus());
  inpValor.addEventListener('input', limpiarError);
  inpValor.addEventListener('change', limpiarError);

  form.addEventListener('submit', async (ev) => {
    ev.preventDefault();
    limpiarError();

    const id = inpId.value;
    const valor = inpValor.value.trim();
    const error = validar(valor);
    if (error) { mostrarError(error); return; }

    if (id) {
      const c = await Swal.fire({
        title: '¿Guardar los cambios?', text: 'Se modificará el cargo.', icon: 'question',
        showCancelButton: true, confirmButtonText: 'Sí, guardar', cancelButtonText: 'Cancelar'
      });
      if (!c.isConfirmed) return;
    }

    btnGuardar.disabled = true;
    try {
      const { data } = await pedir(id ? `${API}/${id}` : API, {
        method: id ? 'PUT' : 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ [CAMPO]: valor })
      });
      if (data && data.success) {
        modal.hide();
        await cargar();
        Swal.fire(id ? 'Actualizado' : 'Agregado', data.mensaje, 'success');
      } else {
        mostrarError((data && data.error) || 'No se pudo guardar el cargo.');
      }
    } catch (e) {
      mostrarError('Ocurrió un error de conexión. Intente nuevamente.');
    } finally {
      btnGuardar.disabled = false;
    }
  });

  tbody.addEventListener('click', async (ev) => {
    const btn = ev.target.closest('button[data-accion]');
    if (!btn) return;
    const id = btn.dataset.id;

    if (btn.dataset.accion === 'editar') {
      try {
        const { data } = await pedir(`${API}/${id}`);
        if (data && data.success) {
          abrirModal('Editar Cargo', data.data[PK], data.data[CAMPO]);
        } else {
          Swal.fire('Error', (data && data.error) || 'No se pudo cargar el cargo.', 'error');
          cargar();
        }
      } catch (e) {
        Swal.fire('Error', 'Ocurrió un error de conexión.', 'error');
      }
    }

    if (btn.dataset.accion === 'anular') {
      await L.anular({
        api: API, id, descripcion: btn.dataset.desc, titulo: '¿Anular este cargo?', exito: 'Anulado',
        errorDefault: 'No se pudo anular el cargo.', recargar: cargar
      });
    }

    if (btn.dataset.accion === 'reactivar') {
      await L.reactivar({
        api: API, id, descripcion: btn.dataset.desc, titulo: '¿Reactivar este cargo?', exito: 'Reactivado',
        errorDefault: 'No se pudo reactivar el cargo.', recargar: cargar
      });
    }
  });

  chkInactivos.addEventListener('change', cargar);
  cargar();
})();
</script>
{% endblock %}
