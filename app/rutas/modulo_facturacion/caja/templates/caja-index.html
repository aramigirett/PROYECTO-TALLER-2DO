{% extends 'base_tabler.html' %}

{% block titulo %}Cajas{% endblock %}

{% block contenido %}
<div class="page-header d-print-none mb-3">
  <div class="row align-items-center">
    <div class="col">
      <div class="page-pretitle">Facturación · Referenciales</div>
      <h2 class="page-title">Cajas</h2>
    </div>
    {% if puede('caja', 'nuevo') %}
    <div class="col-auto ms-auto">
      <button type="button" class="btn btn-primary" id="btnAgregar">
        <i class="fas fa-plus me-2"></i>Agregar
      </button>
    </div>
    {% endif %}
  </div>
</div>

<div class="card">
  <div class="card-header">
    <label class="form-check form-switch mb-0">
      <input class="form-check-input" type="checkbox" id="chkInactivas">
      <span class="form-check-label">Mostrar inactivas</span>
    </label>
  </div>
  <div class="table-responsive">
    <table class="table table-vcenter card-table" id="tbl">
      <thead>
        <tr>
          <th>Descripción</th>
          <th>Consultorio</th>
          <th style="width: 110px;">Estado</th>
          <th class="w-1">Acciones</th>
        </tr>
      </thead>
      <tbody id="tbodyCajas">
        <tr><td colspan="4" class="text-center text-muted py-4">Cargando…</td></tr>
      </tbody>
    </table>
  </div>
</div>

{# Modal Alta / Modificar #}
<div class="modal modal-blur fade" id="modalFormulario" tabindex="-1" aria-labelledby="modalTitle" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="modalTitle"></h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
      </div>
      <form id="formCaja" novalidate>
        <div class="modal-body">
          <input type="hidden" id="txtId">
          <div class="mb-3">
            <label class="form-label required" for="selConsultorio">Consultorio</label>
            <select class="form-select" id="selConsultorio"></select>
            <div class="invalid-feedback"></div>
          </div>
          <div class="mb-3">
            <label class="form-label required" for="txtDescripcion">Descripción</label>
            <input type="text" class="form-control" id="txtDescripcion" maxlength="60"
                   placeholder="Ej.: CAJA RECEPCIÓN" autocomplete="off" style="text-transform: uppercase;">
            <div class="invalid-feedback"></div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-link link-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button type="submit" class="btn btn-primary" id="btnGuardar">Guardar</button>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}

{% block js %}
<script src="{{ url_for('static', filename='js/facturacion-validadores.js') }}"></script>
<script>
(function () {
  const API = '/api/v1/cajas';
  const API_CONSULTORIOS = '/api/v1/consultorios';   // lookup existente: id = codigo, nombre = nombre_consultorio
  const V = window.FacturacionValidadores;
  const PUEDE_EDITAR = {{ 'true' if puede('caja', 'editar') else 'false' }};
  const PUEDE_ANULAR = {{ 'true' if puede('caja', 'anular') else 'false' }};

  const tbody = document.getElementById('tbodyCajas');
  const chkInactivas = document.getElementById('chkInactivas');
  const modalEl = document.getElementById('modalFormulario');
  const modal = bootstrap.Modal.getOrCreateInstance(modalEl);
  const form = document.getElementById('formCaja');
  const inpId = document.getElementById('txtId');
  const btnGuardar = document.getElementById('btnGuardar');
  const campos = {
    id_consultorio: document.getElementById('selConsultorio'),
    descripcion: document.getElementById('txtDescripcion')
  };
  const validadores = {
    id_consultorio: (v) => (v ? '' : 'Debe seleccionar un consultorio.'),
    descripcion: (v) => V.descripcion(v)
  };

  const escapar = (t) => String(t).replace(/[&<>"']/g, (c) =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  const limpiarErrores = () => Object.values(campos).forEach(V.limpiarCampo);

  function validarFormulario() {
    limpiarErrores();
    let primero = null;
    Object.keys(campos).forEach((k) => {
      const msg = validadores[k](campos[k].value);
      if (msg) { V.marcarCampo(campos[k], msg); primero = primero || campos[k]; }
    });
    if (primero) primero.focus();
    return !primero;
  }

  async function pedir(url, opciones) {
    const resp = await fetch(url, opciones);
    let data = null;
    try { data = await resp.json(); } catch (e) { /* respuesta no JSON (ej. 403 HTML) */ }
    return { ok: resp.ok, status: resp.status, data };
  }

  async function cargar() {
    try {
      const { ok, data } = await pedir(chkInactivas.checked ? `${API}?inactivas=1` : API);
      if (!ok || !data || !data.success) throw new Error();
      if (!data.data.length) {
        tbody.innerHTML = '<tr><td colspan="4" class="text-center text-muted py-4">No hay cajas registradas.</td></tr>';
        return;
      }
      tbody.innerHTML = data.data.map((f) => {
        const acciones = [];
        if (f.activo) {
          if (PUEDE_EDITAR) acciones.push(`<button type="button" class="btn btn-sm btn-outline-primary" data-accion="editar" data-id="${f.id_caja}" title="Editar"><i class="fas fa-edit"></i></button>`);
          if (PUEDE_ANULAR) acciones.push(`<button type="button" class="btn btn-sm btn-outline-danger" data-accion="anular" data-id="${f.id_caja}" data-desc="${escapar(f.descripcion)}" title="Anular"><i class="fas fa-ban"></i></button>`);
        } else if (PUEDE_EDITAR) {
          // Reactivar usa el mismo permiso que editar.
          acciones.push(`<button type="button" class="btn btn-sm btn-outline-success" data-accion="reactivar" data-id="${f.id_caja}" data-desc="${escapar(f.descripcion)}" data-consultorio="${escapar(f.consultorio)}" title="Reactivar"><i class="fas fa-undo me-1"></i>Reactivar</button>`);
        }
        const badge = f.activo
          ? '<span class="badge bg-success-lt">Activo</span>'
          : '<span class="badge bg-secondary-lt">Inactivo</span>';
        return `<tr class="${f.activo ? '' : 'text-muted'}">
          <td>${escapar(f.descripcion)}</td>
          <td>${escapar(f.consultorio)}</td>
          <td>${badge}</td>
          <td class="text-nowrap"><div class="btn-list flex-nowrap">${acciones.join('')}</div></td>
        </tr>`;
      }).join('');
    } catch (e) {
      tbody.innerHTML = '<tr><td colspan="4" class="text-center text-danger py-4">No se pudo cargar el listado.</td></tr>';
    }
  }

  /* El combo se recarga cada vez que se abre el modal: refleja los consultorios existentes al día. */
  async function abrirModal(titulo, registro) {
    try {
      const { data } = await pedir(API_CONSULTORIOS);
      if (!data || !data.success) throw new Error();
      campos.id_consultorio.innerHTML = '<option value="">Seleccione un consultorio…</option>' +
        data.data.map((c) => `<option value="${c.codigo}">${escapar(c.nombre_consultorio)}</option>`).join('');
    } catch (e) {
      Swal.fire('Error', 'No se pudieron cargar los consultorios. Intente nuevamente.', 'error');
      return;
    }
    document.getElementById('modalTitle').textContent = titulo;
    inpId.value = registro ? registro.id_caja : '';
    campos.id_consultorio.value = registro ? registro.id_consultorio : '';
    campos.descripcion.value = registro ? registro.descripcion : '';
    limpiarErrores();
    modal.show();
  }

  const btnAgregar = document.getElementById('btnAgregar');
  if (btnAgregar) btnAgregar.addEventListener('click', () => abrirModal('Agregar Caja'));

  chkInactivas.addEventListener('change', cargar);
  modalEl.addEventListener('shown.bs.modal', () => campos.id_consultorio.focus());
  Object.values(campos).forEach((el) => {
    el.addEventListener('input', () => V.limpiarCampo(el));
    el.addEventListener('change', () => V.limpiarCampo(el));
  });

  form.addEventListener('submit', async (ev) => {
    ev.preventDefault();
    if (!validarFormulario()) return;

    const id = inpId.value;
    if (id) {
      const c = await Swal.fire({
        title: '¿Guardar los cambios?',
        text: 'Se modificarán los datos de esta caja.',
        icon: 'question',
        showCancelButton: true,
        confirmButtonText: 'Sí, guardar',
        cancelButtonText: 'Cancelar'
      });
      if (!c.isConfirmed) return;
    }

    const payload = {};
    Object.keys(campos).forEach((k) => { payload[k] = campos[k].value; });

    btnGuardar.disabled = true;
    try {
      const { data } = await pedir(id ? `${API}/${id}` : API, {
        method: id ? 'PUT' : 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      if (data && data.success) {
        modal.hide();
        await cargar();
        Swal.fire(id ? 'Actualizada' : 'Agregada', data.mensaje, 'success');
      } else {
        // La API indica el campo en error; si no, se muestra en la descripción.
        const campo = campos[data && data.campo] || campos.descripcion;
        V.marcarCampo(campo, (data && data.error) || 'No se pudo guardar la caja.');
        campo.focus();
      }
    } catch (e) {
      V.marcarCampo(campos.descripcion, 'Ocurrió un error de conexión. Intente nuevamente.');
    } finally {
      btnGuardar.disabled = false;
    }
  });

  tbody.addEventListener('click', async (ev) => {
    const btn = ev.target.closest('button[data-accion]');
    if (!btn) return;
    const id = btn.dataset.id;

    if (btn.dataset.accion === 'editar') {
      try {
        const { data } = await pedir(`${API}/${id}`);
        if (data && data.success) {
          await abrirModal('Editar Caja', data.data);
        } else {
          Swal.fire('Error', (data && data.error) || 'No se pudo cargar la caja.', 'error');
          cargar();
        }
      } catch (e) {
        Swal.fire('Error', 'Ocurrió un error de conexión.', 'error');
      }
    }

    if (btn.dataset.accion === 'anular') {
      const c = await Swal.fire({
        title: '¿Anular esta caja?',
        text: btn.dataset.desc,
        icon: 'warning',
        showCancelButton: true,
        confirmButtonText: 'Sí, anular',
        cancelButtonText: 'Cancelar',
        confirmButtonColor: '#d63939'
      });
      if (!c.isConfirmed) return;
      try {
        const { data } = await pedir(`${API}/${id}`, { method: 'DELETE' });
        if (data && data.success) {
          await cargar();
          Swal.fire('Anulada', data.mensaje, 'success');
        } else {
          Swal.fire('No se pudo anular', (data && data.error) || 'No se pudo anular la caja.', 'error');
          cargar();
        }
      } catch (e) {
        Swal.fire('Error', 'Ocurrió un error de conexión.', 'error');
      }
    }

    if (btn.dataset.accion === 'reactivar') {
      const c = await Swal.fire({
        title: '¿Reactivar esta caja?',
        text: `${btn.dataset.desc} — ${btn.dataset.consultorio}`,
        icon: 'question',
        showCancelButton: true,
        confirmButtonText: 'Sí, reactivar',
        cancelButtonText: 'Cancelar'
      });
      if (!c.isConfirmed) return;
      try {
        const { data } = await pedir(`${API}/${id}/reactivar`, { method: 'PATCH' });
        if (data && data.success) {
          await cargar();
          Swal.fire('Reactivada', data.mensaje, 'success');
        } else {
          Swal.fire('No se pudo reactivar', (data && data.error) || 'No se pudo reactivar la caja.', 'error');
          cargar();
        }
      } catch (e) {
        Swal.fire('Error', 'Ocurrió un error de conexión.', 'error');
      }
    }
  });

  cargar();
})();
</script>
{% endblock %}
